<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>모바일 스윙 스캐너</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<style>
  :root { --color-bg: #0a0e14; --color-surface: #11161f; --color-surface-2: #151b26; --color-border: #232b39; --color-text: #e4e9f0; --color-primary: #22d3ee; --color-success: #34d399; --color-warning: #fbbf24; --color-error: #f87171; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Satoshi', sans-serif; background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
  
  /* 모바일 상단 바 */
  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(17, 22, 31, 0.95); backdrop-filter: blur(10px); padding: 16px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
  .brand-group { display: flex; flex-direction: column; gap: 4px; }
  .brand { font-size: 1.1rem; font-weight: 700; }
  .update-time { font-size: 0.75rem; color: #8a94a6; font-weight: 400; }
  
  .top-actions { display: flex; gap: 6px; }
  .manual-update-btn { background: var(--color-primary); border: 1px solid var(--color-primary); padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: bold; color: #071018; text-decoration: none; cursor: pointer; }
  .about-btn { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-text); }

  /* 모바일 필터 영역 */
  .filter-container { padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
  .select-group { width: 100%; margin-bottom: 12px; }
  .mcap-select { width: 100%; padding: 10px; border-radius: 8px; background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); font-size: 0.9rem; outline: none; }
  .pill-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .pill-scroll::-webkit-scrollbar { display: none; }
  .pill-btn { padding: 8px 14px; border-radius: 20px; background: var(--color-surface-2); border: 1px solid var(--color-border); color: var(--color-text); font-size: 0.85rem; font-weight: 600; white-space: nowrap; transition: 0.2s; cursor: pointer; }
  .pill-btn.active { background: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }

  /* 카드 피드 영역 */
  .feed-container { padding: 16px; max-width: 920px; margin: 0 auto; }
  .section-title { font-size: 1rem; font-weight: 700; margin: 24px 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .s-table-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
  .s-table-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-border); }
  .s-table-title { font-weight: 700; color: #f3d675; }
  .copy-btn { background: #d4af37; color: #0a0e14; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 800; cursor: pointer; }
  .copy-btn:disabled { opacity: 0.45; cursor: default; }
  .copy-status { min-height: 18px; padding: 0 16px 10px; color: #8a94a6; font-size: 0.75rem; }
  .table-scroll { overflow-x: auto; }
  .s-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .s-table th, .s-table td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--color-border); }
  .s-table th { color: #8a94a6; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .s-table td { font-size: 0.9rem; }
  .s-table tbody tr:last-child td { border-bottom: 0; }
  .s-table .score-cell { color: var(--color-primary); font-weight: 800; }
  .s-table .ticker-cell { font-weight: 800; }
  .empty-row { color: #8a94a6; text-align: center !important; padding: 20px !important; }
  
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .card-header { padding: 16px; border-bottom: 1px solid var(--color-border); }
  .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ticker-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .ticker { font-size: 1.2rem; font-weight: 700; }
  .price { font-size: 1.1rem; font-weight: 700; }
  
  .badge-S { background: linear-gradient(135deg, #d4af37, #f3e5ab); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
  .badge-A { background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
  .badge-B { background: #64748b; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
  .tag-strat { font-size: 0.75rem; color: #8a94a6; border: 1px solid #232b39; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  .score-badge { font-size: 0.85rem; font-weight: 800; color: var(--color-primary); }
  
  .overlap-text { font-size: 0.75rem; color: #a1a1aa; margin-top: 2px; }
  .msg { font-size: 0.9rem; color: #a1a1aa; margin: 10px 0; line-height: 1.4; }
  
  .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .metric-item { background: var(--color-surface-2); padding: 8px; border-radius: 6px; text-align: center; border: 1px solid var(--color-border); }
  .m-label { font-size: 0.7rem; color: #8a94a6; margin-bottom: 2px; }
  .m-val { font-size: 0.85rem; font-weight: 700; }
  .sl-red { color: var(--color-error); }

  .card-img-wrap { width: 100%; background: #fff; padding: 10px; border-bottom: 1px solid var(--color-border); }
  .card-img-wrap img { width: 100%; display: block; filter: invert(0.9) hue-rotate(180deg); }
  
  .card-actions { padding: 12px; }
  .btn-full { display: block; width: 100%; text-align: center; padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; color: #fff; text-decoration: none; background: #720e9e; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <div class="brand">🎯 4-Core 스캐너</div>
      <div class="update-time" id="updateTimeText">데이터 로딩 중...</div>
    </div>
    <div class="top-actions">
      <a href="about.html" class="manual-update-btn about-btn">스캐너 설명</a>
      <a href="https://github.com/jkshin933/stock-swing-screener/actions/workflows/scan.yml" target="_blank" class="manual-update-btn" title="GitHub Actions에서 Run workflow를 누르세요">새 스캔 실행</a>
    </div>
  </header>

  <div class="filter-container">
    <div class="select-group">
      <select class="mcap-select" id="mcapFilter">
        <option value="ALL" selected>전체 시가총액</option> <!-- 기본값 해제 해제 -->
        <option value="OVER10B">대형주 집중 ($10B 이상)</option>
        <option value="MEGA">초대형주 ($200B 이상)</option>
        <option value="MID">중소형주 ($10B 미만)</option>
      </select>
    </div>
    <div class="pill-scroll">
      <button class="pill-btn active" data-filter="ALL">전체</button>
      <button class="pill-btn" data-filter="20EMA">📉 20EMA</button>
      <button class="pill-btn" data-filter="VCP">🎯 VCP</button>
      <button class="pill-btn" data-filter="B&R">🔄 B&R</button>
      <button class="pill-btn" data-filter="MTF">🔥 MTF</button>
    </div>
  </div>

  <main class="feed-container">
    <div class="section-title"><span style="color:#f3d675">🏆 S급 리스트</span><span id="cnt-s">0</span></div>
    <section class="s-table-panel" aria-labelledby="s-table-heading">
      <div class="s-table-header">
        <span class="s-table-title" id="s-table-heading">최상위 Setup Quality</span>
        <button class="copy-btn" id="copySTable" type="button">Copy</button>
      </div>
      <div class="table-scroll">
        <table class="s-table">
          <thead><tr><th>Score</th><th>Ticker</th><th>Strategy</th></tr></thead>
          <tbody id="sTableBody"></tbody>
        </table>
      </div>
      <div class="copy-status" id="copyStatus" role="status" aria-live="polite"></div>
    </section>

    <div class="section-title"><span style="color:var(--color-success)">🟢 당장 매수 (Action)</span><span id="cnt-action">0</span></div>
    <div id="feed-action"></div>

    <div class="section-title" style="margin-top: 32px;"><span style="color:var(--color-warning)">🟡 구조 대기 (Setup)</span><span id="cnt-setup">0</span></div>
    <div id="feed-setup"></div>

    <div class="section-title" style="margin-top: 32px;"><span style="color:#94a3b8">⚪ B급 Watch</span><span id="cnt-watch">0</span></div>
    <div id="feed-watch"></div>
  </main>

<script>
  let globalData = [];
  let stratFilter = 'ALL';

  function getSGradeRows() {
    return globalData
      .filter(item => item.grade === 'S' && ['action', 'setup'].includes(item.state))
      .sort((a, b) => (b.score || 0) - (a.score || 0) || String(a.symbol).localeCompare(String(b.symbol)));
  }

  function renderSTable() {
    const rows = getSGradeRows();
    const body = document.getElementById('sTableBody');
    const copyButton = document.getElementById('copySTable');
    body.innerHTML = '';
    document.getElementById('cnt-s').textContent = rows.length;
    copyButton.disabled = rows.length === 0;

    if (rows.length === 0) {
      const row = body.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 3;
      cell.className = 'empty-row';
      cell.textContent = '현재 S급 종목이 없습니다.';
      return;
    }

    rows.forEach(item => {
      const row = body.insertRow();
      const score = row.insertCell();
      const ticker = row.insertCell();
      const strategy = row.insertCell();
      score.textContent = item.score ?? '';
      ticker.textContent = item.symbol ?? '';
      strategy.textContent = item.strategy ?? '';
      score.className = 'score-cell';
      ticker.className = 'ticker-cell';
    });
  }

  async function copySTable() {
    const rows = getSGradeRows();
    if (!rows.length) return;

    const text = [
      'Score\tTicker\tStrategy',
      ...rows.map(item => `${item.score ?? ''}\t${item.symbol ?? ''}\t${item.strategy ?? ''}`)
    ].join('\n');

    const status = document.getElementById('copyStatus');
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = `${rows.length}개 S급 종목을 복사했습니다.`;
    } catch (error) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      status.textContent = `${rows.length}개 S급 종목을 복사했습니다.`;
    }
    window.setTimeout(() => { status.textContent = ''; }, 2500);
  }

  function renderFeed() {
    document.getElementById('feed-action').innerHTML = '';
    document.getElementById('feed-setup').innerHTML = '';
    document.getElementById('feed-watch').innerHTML = '';
    const mcapFilter = document.getElementById('mcapFilter').value;
    let counts = { action: 0, setup: 0, watch: 0 };

    globalData.filter(item => {
      // 1. Working, Failed 제외 (Action, Setup만 표시)
      if (item.state !== 'action' && item.state !== 'setup') return false;
      
      // 2. 60점 이상 S/A/B만 표시
      if (!['S', 'A', 'B'].includes(item.grade)) return false;

      // 3. 전략 및 시가총액 필터 적용
      let passStrat = (stratFilter === 'ALL' || item.strategy === stratFilter);
      let passMcap = true;
      if(mcapFilter === 'OVER10B') passMcap = item.mcap >= 10;
      else if(mcapFilter === 'MEGA') passMcap = item.mcap >= 200;
      else if(mcapFilter === 'MID') passMcap = item.mcap < 10;
      
      return passStrat && passMcap;
    }).sort((a, b) => {
      // Setup 및 Action 내부 정렬: 점수(Score) 내림차순 최우선
      if (a.state === 'setup') return (b.score || 0) - (a.score || 0) || (b.rs_rating || 0) - (a.rs_rating || 0);
      if (a.state === 'action') return (b.score || 0) - (a.score || 0) || (b.rs_rating || 0) - (a.rs_rating || 0);
      return 0;
    }).forEach(item => {
      const displayState = item.grade === 'B' ? 'watch' : item.state;
      const container = document.getElementById(`feed-${displayState}`);
      if(container) { 
        container.insertAdjacentHTML('beforeend', createFeedCard(item)); 
        counts[displayState]++; 
      }
    });

    document.getElementById('cnt-action').textContent = counts.action;
    document.getElementById('cnt-setup').textContent = counts.setup;
    document.getElementById('cnt-watch').textContent = counts.watch;
  }

  function createFeedCard(item) {
    const badgeHtml = `<span class="badge-${item.grade}">${item.grade}급</span>`;
    const mcapText = item.mcap >= 1000 ? `$${(item.mcap/1000).toFixed(1)}T` : `$${item.mcap.toFixed(1)}B`;
    const scoreHtml = item.score ? `<span class="score-badge">[${item.score}점]</span>` : '';

    // 다중 셋업(Overlap) 렌더링
    let overlapHtml = '';
    if (item.setups && Object.keys(item.setups).length > 1) {
      let otherSetups = [];
      for (const [strat, score] of Object.entries(item.setups)) {
        if (strat !== item.strategy) otherSetups.push(`${strat} ${score}`);
      }
      if(otherSetups.length > 0) {
        overlapHtml = `<div class="overlap-text">+ Also: ${otherSetups.join(', ')}</div>`;
      }
    }

    let slHtml = item.state === 'action' ? `<div class="metric-item"><div class="m-label">구조손절가</div><div class="m-val sl-red">$${item.sl}</div></div>` : '';

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-top-row">
            <div class="ticker-wrap">
              ${badgeHtml}
              <span class="ticker">${item.symbol}</span>
              <span class="tag-strat">${item.strategy}</span>
              ${scoreHtml}
            </div>
            <span class="price">$${item.price.toFixed(2)}</span>
          </div>
          ${overlapHtml}
          <div class="msg">${item.msg}</div>
          <div class="metrics-grid">
            <div class="metric-item"><div class="m-label">RS 점수</div><div class="m-val">${item.rs_rating}</div></div>
            <div class="metric-item"><div class="m-label">상대거래량</div><div class="m-val">${item.rvol}</div></div>
            <div class="metric-item"><div class="m-label">시가총액</div><div class="m-val">${mcapText}</div></div>
            ${slHtml}
          </div>
        </div>
        <div class="card-img-wrap">
          <img src="https://charts2.finviz.com/chart.ashx?t=${item.symbol}" alt="chart">
        </div>
        <div class="card-actions">
          <a href="https://finance.yahoo.com/chart/${item.symbol}" target="_blank" class="btn-full">Yahoo 차트 열기</a>
        </div>
      </div>
    `;
  }

  // 필터 버튼 이벤트
  document.querySelectorAll('.pill-btn').forEach(btn => btn.addEventListener('click', (e) => {
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    stratFilter = e.target.dataset.filter;
    renderFeed();
  }));

  // 시가총액 드롭다운 이벤트
  document.getElementById('mcapFilter').addEventListener('change', renderFeed);
  document.getElementById('copySTable').addEventListener('click', copySTable);

  async function loadResults() {
    const label = document.getElementById('updateTimeText');
    label.textContent = '결과 불러오는 중...';

    try {
      const response = await fetch(`dashboard_data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const lastModified = response.headers.get('Last-Modified');
      const data = await response.json();
      globalData = Array.isArray(data) ? data : [];

      const scanTimestamp = globalData.find(item => item.scan_ts_utc)?.scan_ts_utc;
      const updateDate = new Date(scanTimestamp || lastModified || Date.now());
      label.textContent = updateDate.toLocaleString('ko-KR', {
        timeZone: 'America/New_York', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }) + ' ET 스캔';
      renderSTable();
      renderFeed();
    } catch (error) {
      label.textContent = '데이터 오류';
      console.error(error);
    }
  }

  loadResults();
</script>
</body>
</html>
