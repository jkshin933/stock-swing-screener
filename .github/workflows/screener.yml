name: Daily S&P 500 Swing Screener

on:
  schedule:
    # 🇺🇸 미국 동부시각(ET) 월~금 저녁 6:00 PM (서머타임 기준 UTC 22:00)
    # 🇰🇷 한국시각(KST) 화~토 아침 7:00 AM
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 버튼

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy lxml google-generativeai

      - name: Execute Screener Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python screener.py
