name: Daily 20EMA Swing Screener

on:
  schedule:
    # 월~금 UTC 22:00 (미국 동부시각 18:00 ET)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 직접 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy lxml

      - name: 스크리너 실행 및 디스코드 전송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python screener.py
