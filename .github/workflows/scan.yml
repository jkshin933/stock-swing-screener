name: Run stock screener

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US market close. Avoid minute 0 because scheduled
    # GitHub Actions can be delayed or dropped during top-of-hour congestion.
    - cron: "17 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pandas yfinance lxml html5lib beautifulsoup4

      - name: Run screener
        run: python screener.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- dashboard_data.json state.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json state.json
          git commit -m "Update screener data"
          git push
