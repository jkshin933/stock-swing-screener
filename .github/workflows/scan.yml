name: Daily Swing Screener

on:
  schedule:
    - cron: '30 20 * * 1-5' # 매주 월~금 밤 8:30 UTC (미국 동부 마감 후 4:30 PM)
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write # 코드가 state.json을 저장할 수 있는 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install pandas numpy yfinance
      
    - name: Run Screener Engine
      run: python screener.py
      
    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add state.json dashboard_data.json
        git commit -m "Auto-update state machine" || echo "No changes to commit"
        git push
